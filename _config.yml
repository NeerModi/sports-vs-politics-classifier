site: Sports vs Politics Classifier
title: Sports vs Politics News Classification
description: Machine Learning Classification System using Natural Language Processing  - 97.32% Accuracy
author: Neer Modi
email: neermodi@example.com

# Build settings
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Navigation
navigation:
  - title: Home
    url: /
  - title: Results
    url: /results
  - title: Models
    url: /models
  - title: Methodology
    url: /methodology
  - title: GitHub
    url: https://github.com/NeerModi/sports-vs-politics-classifier

# Markdown settings
markdown: kramdown
